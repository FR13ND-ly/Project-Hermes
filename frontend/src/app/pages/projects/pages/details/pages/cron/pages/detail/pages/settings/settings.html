@if (parent.selectedCronJob(); as job) {
<div class="space-y-6 animate-fade-in">
  
  <div class="bg-zinc-900 border border-zinc-900 rounded-lg p-5 space-y-5 shadow-sm">
    <h3 class="text-sm font-semibold text-zinc-100 border-b border-zinc-900 pb-3">Edit cron job properties</h3>
    
    <div class="space-y-4 text-[13px] font-sans">
      <!-- Job Name -->
      <div class="space-y-1.5">
        <label for="edit-cron-name" class="text-xs font-semibold text-zinc-400">Job Name</label>
        <input 
          id="edit-cron-name"
          type="text" 
          [ngModel]="parent.editName()"
          (ngModelChange)="parent.editName.set($event)"
          class="block w-full px-3 py-2 input font-mono"
        />
      </div>

      <!-- Target App -->
      @if ((job.targetType || job.target_type || 'app') === 'app') {
        <div class="space-y-1.5">
          <label for="edit-cron-app" class="text-xs font-semibold text-zinc-400">Target App</label>
          <select 
            id="edit-cron-app"
            [ngModel]="parent.editAppId()"
            (ngModelChange)="parent.editAppId.set($event)"
            class="block w-full px-3 py-2 input font-mono cursor-pointer"
          >
            @for (app of parent.parent.apps(); track app.id) {
              <option [value]="app.id">{{ app.name }}</option>
            }
          </select>
        </div>
      }

      <!-- Status -->
      <div class="space-y-1.5">
        <label for="edit-cron-status" class="text-xs font-semibold text-zinc-400">Operating Status</label>
        <select 
          id="edit-cron-status"
          [ngModel]="parent.editStatus()"
          (ngModelChange)="parent.editStatus.set($event)"
          class="block w-full px-3 py-2 text-[13px] input cursor-pointer font-mono"
        >
          <option value="active">Active (Automatic periodic run)</option>
          <option value="paused">Paused (Temporarily stopped)</option>
        </select>
      </div>

      <!-- Schedule -->
      <div class="space-y-1.5">
        <label for="edit-cron-schedule" class="text-xs font-semibold text-zinc-400">Schedule (Cron Syntax)</label>
        <input 
          id="edit-cron-schedule"
          type="text" 
          [ngModel]="parent.editSchedule()"
          (ngModelChange)="parent.editSchedule.set($event)"
          class="block w-full px-3 py-2 bg-zinc-955 border border-zinc-850 rounded text-zinc-50 focus:outline-none focus:border-zinc-500 transition-colors font-mono"
        />
        <p class="text-[11px] text-zinc-550 leading-normal font-sans font-medium">
          Format: standard 5-field (e.g.: <code class="text-zinc-400 font-bold select-all">*/15 * * * *</code>) or 6-field (seconds included).
        </p>
      </div>

      <!-- Command -->
      <div class="space-y-1.5">
        <label for="edit-cron-command" class="text-xs font-semibold text-zinc-400">Command to Execute</label>
        <textarea 
          id="edit-cron-command"
          rows="3"
          [ngModel]="parent.editCommand()"
          (ngModelChange)="parent.editCommand.set($event)"
          class="block w-full px-3 py-2 bg-zinc-955 border border-zinc-850 rounded text-zinc-50 focus:outline-none focus:border-zinc-500 transition-colors font-mono resize-none font-semibold"
        ></textarea>
      </div>
    </div>

    <div class="pt-3 border-t border-zinc-900 flex justify-end gap-2 text-[13px]">
      <button 
        (click)="parent.selectCronJob(job)"
        [disabled]="parent.savingSettings()"
        class="btn btn-secondary btn-sm"
      >
        Cancel
      </button>
      <button 
        (click)="parent.onSaveSettings()"
        [disabled]="parent.savingSettings() || !parent.editName().trim() || !parent.editSchedule().trim() || !parent.editCommand().trim()"
        class="btn btn-primary btn-sm"
      >
        @if (parent.savingSettings()) {
          <svg class="animate-spin h-3 w-3 text-zinc-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span>Saving...</span>
        } @else {
          <span>Save settings</span>
        }
      </button>
    </div>
  </div>

  <!-- Danger Zone: delete cron job -->
  <app-danger-zone
    heading="Delete this cron job"
    description="Permanently deletes the scheduled job along with its run history and logs."
    resourceKind="cron job"
    [resourceName]="job.name"
    confirmLabel="Delete cron job"
    (confirmed)="parent.onDeleteCronJob(job.id)"
  />

</div>
}
